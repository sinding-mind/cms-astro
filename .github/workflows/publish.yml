name: Publish

# Publishes @sindingmind/cms-astro to npm when a tag v* is pushed, with npm trusted publishing (OIDC) and provenance.
# There is no npm token anywhere: npmjs.com trusts this workflow file in sinding-mind/cms-astro (see docs/RELEASING.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check that npm supports trusted publishing (11.5.1 or newer)
        run: |
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) { console.error(`npm ${process.argv[1]} is too old for trusted publishing`); process.exit(1); }
          ' "$(npm --version)"
      - name: Check that the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm publish --provenance --access public
